<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotogramm</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="icon" href="./assets/icons/favicon.png">
</head>
<!-- names: Dateinamen in kebab-case : user-utils.js
Funktionen im camelCase function getUser() {...};
Klassen in PascalCase class UserProfile {};
Konstanten in UPPER_CASE const MAX_RETRIES = 3;
 -->

<body onload="rendPhotos()">
    <header class="HeaderMain">
        <div class="HeaderInner ContentWrapper">
            <img class="HeaderLogo" src="./assets/img/Capa_1.png" alt="Fotogramm Logo">
        </div>

    </header>

    <main>

        <section class="PhotosAlbum">
            <div class="ContentWrapper">
                <h1>Your personal photo album</h1>
            </div>

            <div class="PhotosBox ContentWrapper" id="photoAlbum"></div>
     
            <dialog  class="DialogAlbum" id="dialogAlbum" onclick="if(event.target === this) this.close()" onkeydown="
            if(event.key==='ArrowRight'){ showNextImage(); } 
            else if(event.key==='ArrowLeft'){ showPrevImage(); } ">

                <header class="DialogHeader">
                    <h2 class="CurrentImageNumber" id="dialogTitel">hi</h2>
                    <img class="DialogCloseIcon" onclick="closeDialog()" src="./assets/img/Close icon.png" alt="">
                </header>

                <main>
                    <img class="DialogMainImage" id="dialogImage" />
                </main>

                <footer class="DialogFooter">
                    <img class="NavigationBarImage"  onclick="showPrevImage()" src="./assets/img/Button.png" alt="navigation to the left">

                    <p class="CurrentImageNumber" id="currentImageNumber"></p>

                    <img class="NavigationBarImage" onclick="showNextImage()" src="./assets/img/Property 1=Default.png" alt="navigation to the right">
                </footer>

            </dialog>

    </main>

    <footer class="SiteFooter">
        <div class="FooterInner ContentWrapper">
            <img src="./assets/img/Frame 6.png" alt="Develeper Akademie footer logo">
        </div>
    </footer>
</body>

</html>
